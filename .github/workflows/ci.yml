name: Enterprise CI Pipeline

env:
  ENVIRONMENT: development

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # 3. Show Environment
      - name: Show Environment
        run: echo "Running in $ENVIRONMENT"

      # 4. Build and Test
      - name: Build
