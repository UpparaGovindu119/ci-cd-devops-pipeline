name: Enterprise CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ENVIRONMENT: development

jobs:
  build-and-scan:
    name: Build, Test and Push
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Java 17 and Maven cache
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # 3. Display environment
      - name: Show Environment
        run: |
          echo "Running in $ENVIRONMENT"

      # 4. Verify Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # 5. Build and test application
      - name: Build and Test Application
        run: mvn clean verify

      # 6. SonarQube code quality scan
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.3.0.6276:sonar \
            -Dsonar.projectKey=ci-cd-devops-pipeline \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # 7. Trivy filesystem security scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 8. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            upparagovindu/ci-cd-devops-pipeline:latest
            upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

      # 10. Deploy Application to AWS EC2 via SSH
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest Docker image..."
            docker pull upparagovindu/ci-cd-devops-pipeline:latest

            echo "Stopping existing container if running..."
            docker stop spring-app || true
            docker rm spring-app || true

            echo "Running new Spring Boot container on port 8080..."
            docker run -d \
              --name spring-app \
              --network app-net \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI="mongodb://mongodb:27017/devopsdb" \
              upparagovindu/ci-cd-devops-pipeline:latest

            echo "Deployment completed successfully!"
