
---
- name: Deploy Spring Boot and MongoDB Application
  hosts: localhost
  connection: local
  become: false

  vars:
    docker_image: "upparagovindu/ci-cd-devops-pipeline:latest"
    container_name: "spring-app"
    mongo_container: "mongodb"
    network_name: "devops-net"

  tasks:

    - name: Verify Docker daemon is accessible
      command: docker info
      changed_when: false

    - name: Create Docker bridge network
      community.docker.docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Pull latest MongoDB image
      community.docker.docker_image:
        name: "mongo:latest"
        source: pull

    - name: Run MongoDB container
      community.docker.docker_container:
        name: "{{ mongo_container }}"
        image: "mongo:latest"
        state: started
        restart_policy: always
        networks:
          - name: "{{ network_name }}"

    - name: Pull latest Spring Boot application image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull
        force_source: true

    - name: Run Spring Boot application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        recreate: true
        restart_policy: always
        networks:
          - name: "{{ network_name }}"
        env:
          SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/devopsdb"
        ports:
          - "8080:8080"
