---
- name: Deploy Spring Boot & MongoDB Application on Ubuntu Server
  hosts: localhost
  connection: local
  become: yes
  vars:
    docker_image: "upparagovindu/ci-cd-devops-pipeline:latest"
    container_name: "spring-app"
    network_name: "devops-net"

  tasks:
    - name: Ensure Docker service is started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker bridge network if not exists
      docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Run MongoDB container
      docker_container:
        name: "mongodb"
        image: "mongo:latest"
        state: started
        restart_policy: always
        networks:
          - name: "{{ network_name }}"
        ports:
          - "27017:27017"

    - name: Pull latest Spring Boot application image
      docker_image:
        name: "{{ docker_image }}"
        source: pull
        force_source: yes

    - name: Stop existing Spring application container
      docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: yes

    - name: Run new Spring Boot application container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        networks:
          - name: "{{ network_name }}"
        env:
          MONGO_HOST: "mongodb"
          MONGO_PORT: "27017"
          MONGO_DB: "devopsdb"
        ports:
          - "8080:8080"

